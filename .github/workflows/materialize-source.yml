name: Materialize source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore normal source tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, subprocess, json
          root = Path('.')
          gz = root / 'src/main.jsx.gz'
          if gz.exists():
              data = gz.read_bytes()
          else:
              data = subprocess.check_output(['git','show','1d7b7d05b9970bf26638a46202137586ec69654e:src/main.jsx.gz'])
          (root / 'src/main.jsx').write_bytes(gzip.decompress(data))
          pkg = json.loads((root / 'package.json').read_text())
          pkg['scripts']['predev'] = 'node scripts/fetch-single-model.mjs'
          pkg['scripts']['prebuild'] = 'node scripts/fetch-single-model.mjs'
          (root / 'package.json').write_text(json.dumps(pkg, indent=2) + '\n')
          for file in [root / 'src/main.jsx.gz', root / 'scripts/restore-main.mjs']:
              if file.exists():
                  file.unlink()
          PY
          git config user.name "FACF source repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add -f src/main.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore normal source tree"
          git push
