name: Vendor aircraft asset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact aircraft asset
        shell: bash
        run: |
          mkdir -p public/assets
          URL="$(printf '%s' '' | base64 -d)"
          curl --fail --location --retry 3 "$URL" -o public/assets/facf-787-single.glb
          test "$(stat -c%s public/assets/facf-787-single.glb)" -gt 1000000
          git config user.name "FACF asset vendor"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/assets/facf-787-single.glb
          git commit -m "Vendor integrated aircraft asset"
          git push
